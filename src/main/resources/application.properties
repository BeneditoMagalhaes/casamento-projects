# A maioria dos servicos de hospedagem (Railway, Render, etc.) informam a porta
# a ser usada pela variavel de ambiente PORT. Localmente, sem essa variavel,
# continua usando 8080.
server.port=${PORT:8080}

# Banco de dados: arquivo local em H2, criado automaticamente em <DB_PATH>.mv.db
# Nao precisa instalar nenhum banco separado. DB_PATH deve apontar para dentro
# do disco/volume persistente quando hospedado (senao os dados se perdem a
# cada novo deploy).
spring.datasource.url=jdbc:h2:file:${DB_PATH:./data/wedding};AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Upload de fotos da galeria. Assim como o banco, UPLOAD_DIR deve apontar para
# dentro do disco/volume persistente quando hospedado.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload-dir=${UPLOAD_DIR:./uploads}

# Credenciais do painel admin (o casal).
# IMPORTANTE: troque esses valores antes de publicar o site, de preferencia
# definindo as variaveis de ambiente ADMIN_USERNAME e ADMIN_PASSWORD em vez
# de editar aqui, para nao deixar a senha real dentro do codigo-fonte.
app.admin.username=${ADMIN_USERNAME:noivos}
app.admin.password=${ADMIN_PASSWORD:trocar123}

# Cookie de sessao
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=12h

# Notificacao por e-mail quando alguem confirma presenca (RSVP).
# Sem essas variaveis configuradas, o site funciona normal, so nao manda
# e-mail. NOTIFY_EMAIL eh o e-mail dos noivos que vai RECEBER o aviso;
# MAIL_USERNAME/MAIL_PASSWORD sao a conta que vai ENVIAR o e-mail (ex: uma
# conta do Gmail com senha de app). Pode ser a mesma conta ou nao.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.notify-email=${NOTIFY_EMAIL:}
